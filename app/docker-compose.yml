version: '3.8'

services:
  dvc-api:
    build:
      context: ..
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - GIT_REPO_URL=${GIT_REPO_URL}
      - LOG_LEVEL=info
